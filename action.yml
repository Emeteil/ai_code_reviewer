name: 'AI Code Review based on Opencode'
description: 'Agentic AI code review for pull requests via opencode: structured, context-aware, remembers previous passes.'
author: 'Emeteil'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  model:
    description: 'opencode model id.'
    required: false
    default: 'opencode/deepseek-v4-flash-free'
  language:
    description: 'Language of the review output.'
    required: false
    default: 'English'
  max-diff-bytes:
    description: 'Maximum diff size (in bytes) included in the prompt.'
    required: false
    default: '40000'
  main-prompt-file:
    description: 'Path to the core reviewer prompt. Empty = the bundled prompts/main.md.'
    required: false
    default: ''
  project-context-file:
    description: 'Path (in the caller repo) to a project-specific context prompt. Skipped if the file does not exist.'
    required: false
    default: '.github/ai-review/project-context.md'
  extra-instructions:
    description: 'Extra one-off instructions appended to the prompt.'
    required: false
    default: ''
  title:
    description: 'Heading used for the PR comment.'
    required: false
    default: '🤖 AI Code Review'
  comment-mode:
    description: 'update = edit a single comment; create = post a new comment each run.'
    required: false
    default: 'update'
  include-previous:
    description: 'Feed the previous AI review of this PR into the context.'
    required: false
    default: 'true'
  include-comments:
    description: 'Save other reviewers'' comments into pr-comments/others/ for on-demand reading.'
    required: false
    default: 'true'
  snippets-dir:
    description: 'Directory (in the caller repo) overriding the bundled prompts/snippets/*.md. Each present file wins; missing ones fall back to the bundled snippet.'
    required: false
    default: ''
  comment-marker:
    description: 'Hidden HTML marker identifying the review comment. Change it to run several independent reviewers on one PR.'
    required: false
    default: '<!-- ai-code-review -->'
  opencode-args:
    description: 'Extra CLI arguments passed to `opencode run` (e.g. an agent flag).'
    required: false
    default: ''
  fail-on-error:
    description: 'Fail the job if the model call fails, instead of posting a fallback comment.'
    required: false
    default: 'false'
  opencode-api-key:
    description: 'API key for the opencode provider (if the model requires one).'
    required: false
    default: ''
  github-token:
    description: 'Token used to read PR data and post the comment.'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install opencode
      shell: bash
      run: npm install -g opencode-ai

    - name: Collect diff and context
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
        SNIPPETS_DIR: ${{ inputs.snippets-dir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/collect-context.sh"

    - name: Collect PR comments
      uses: actions/github-script@v7
      env:
        INCLUDE_PREVIOUS: ${{ inputs.include-previous }}
        INCLUDE_COMMENTS: ${{ inputs.include-comments }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await require(`${process.env.GITHUB_ACTION_PATH}/scripts/collect-comments.js`)({ github, context, core });

    - name: Assemble prompt
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        MAIN_PROMPT_FILE: ${{ inputs.main-prompt-file }}
        PROJECT_CONTEXT_FILE: ${{ inputs.project-context-file }}
        EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        INCLUDE_PREVIOUS: ${{ inputs.include-previous }}
        INCLUDE_COMMENTS: ${{ inputs.include-comments }}
        SNIPPETS_DIR: ${{ inputs.snippets-dir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/assemble-prompt.sh"

    - name: Run AI review
      shell: bash
      env:
        AI_REVIEW_MODEL: ${{ inputs.model }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        OPENCODE_ARGS: ${{ inputs.opencode-args }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-review.sh"

    - name: Post or update PR comment
      uses: actions/github-script@v7
      env:
        AI_REVIEW_TITLE: ${{ inputs.title }}
        AI_REVIEW_MODEL: ${{ inputs.model }}
        AI_REVIEW_COMMENT_MODE: ${{ inputs.comment-mode }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        SNIPPETS_DIR: ${{ inputs.snippets-dir }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await require(`${process.env.GITHUB_ACTION_PATH}/scripts/post-comment.js`)({ github, context, core });
